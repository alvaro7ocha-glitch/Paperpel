<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha Retrô — Paperpel</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        body {
            background-color: #0d1b2a;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .ppg-app {
            background: #2b1d0c;
            border: 4px solid #d4af37;
            border-radius: 8px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .ppg-header {
            text-align: center;
            margin-bottom: 15px;
        }
        .ppg-status {
            color: #d4af37;
            font-weight: bold;
            margin-top: 10px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="ppg-app" id="ppg-app">
        <div class="ppg-header">
            <h2>Ficha do Aventureiro</h2>
        </div>
        
        <div id="ppg-status" class="ppg-status">A carregar ficha da nuvem...</div>

        <!-- Estrutura simplificada para renderização dos dados da API -->
        <div style="margin-top: 20px;">
            <label><strong>Nome:</strong></label>
            <input type="text" id="ppg-nome" readonly style="width: 100%; padding: 5px; margin-top: 5px; background: #1a1107; color: #d4af37; border: 1px solid #d4af37;">
        </div>

        <div style="margin-top: 15px;">
            <label><strong>Classe:</strong></label>
            <input type="text" id="ppg-classe" readonly style="width: 100%; padding: 5px; margin-top: 5px; background: #1a1107; color: #d4af37; border: 1px solid #d4af37;">
        </div>

        <div style="margin-top: 15px;">
            <label><strong>Hobbies:</strong></label>
            <textarea id="ppg-hobbies" readonly style="width: 100%; padding: 5px; margin-top: 5px; background: #1a1107; color: #d4af37; border: 1px solid #d4af37; resize: none;"></textarea>
        </div>
    </div>

    <!-- Script de gamificação que faz a requisição à API da Render -->
    <script src="../gamificacao.js"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Ferramenta Paperpel para organizar múltiplas imagens em uma folha A4, A3 ou SRA3 e baixar em alta resolução.">
  <title>Múltiplo por folha | Paperpel Gráfica</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <button class="brand-icon" id="toolMenuBtn" type="button" title="Trocar de ferramenta" aria-label="Trocar de ferramenta" aria-expanded="false">
        <img src="assets/multiplo-icon.png" alt="">
      </button>
      <span class="brand-title">Múltiplo por folha</span>
      <nav id="toolMenu" class="tool-menu hidden" aria-label="Ferramentas">
        <a href="./" class="current">Múltiplo por folha</a>
        <a href="foto-edit-paperpel/">Foto Edit</a>
      </nav>
    </div>
    <span class="brand-name">PAPERPEL GRÁFICA</span>
  </header>
  <main class="workspace">
    <aside class="sidebar">
      <div class="controls-row">
        <label for="copies">Cópias de cada imagem:</label>
        <input id="copies" type="number" min="1" max="500" value="1">
        <label class="check-label"><input id="fit" type="checkbox"> Ajustar imagem ao quadro</label>
      </div>

      <div class="paper-tabs" role="group" aria-label="Tamanho do papel">
        <button class="paper-tab active" data-paper="A4">A4</button>
        <button class="paper-tab" data-paper="A3">A3</button>
        <button class="paper-tab" data-paper="SRA3">SRA3</button>
      </div>

      <section class="upload-card">
        <h1>Envie uma ou mais imagens</h1>
        <label class="dropzone" id="dropzone" for="fileInput">
          <input id="fileInput" type="file" accept="image/png,image/jpeg,.png,.jpg,.jpeg" multiple>
          <span class="upload-icon">▧</span>
          <span>Enviar imagens</span>
          <small>ou arraste os arquivos para cá</small>
        </label>
        <div id="fileList" class="file-list" aria-live="polite"></div>
        <label class="cut-option"><input id="cutLines" type="checkbox"> linha de corte</label>
        <p class="formats">Formatos suportados: PNG | JPEG</p>
      </section>

      <div class="download-area">
        <div class="format-row">
          <label for="format">Formato:</label>
          <select id="format"><option value="png">PNG</option><option value="jpeg">JPG</option></select>
        </div>
        <button id="download" class="download-button" disabled>BAIXAR</button>
        <p id="status" class="status" aria-live="polite">Adicione imagens para começar.</p>
      </div>
    </aside>

    <section class="preview-area">
      <div class="preview-toolbar">
        <div>
          <strong>Pré-visualização</strong>
          <span id="paperInfo">A4 • Retrato</span>
        </div>
        <div class="size-info" id="sizeInfo">Aguardando imagens</div>
      </div>
      <div class="sheet-stage">
        <div class="empty-state" id="emptyState">
          <img class="empty-watermark" src="assets/empty-watermark.png" alt="">
          <strong>Sua folha aparecerá aqui</strong>
          <span>Envie uma ou mais imagens para visualizar a montagem.</span>
        </div>
        <canvas id="previewCanvas" aria-label="Pré-visualização da folha montada"></canvas>
      </div>
    </section>
  </main>
  <script>
  (() => {
    const button = document.getElementById('toolMenuBtn');
    const menu = document.getElementById('toolMenu');
    button.addEventListener('click', (event) => {
      event.stopPropagation();
      const opening = menu.classList.contains('hidden');
      menu.classList.toggle('hidden', !opening);
      button.setAttribute('aria-expanded', String(opening));
    });
    document.addEventListener('click', (event) => {
      if (!menu.contains(event.target) && !button.contains(event.target)) {
        menu.classList.add('hidden');
        button.setAttribute('aria-expanded', 'false');
      }
    });
  })();
</script>
<script src="app.js"></script>
</body>
</html>

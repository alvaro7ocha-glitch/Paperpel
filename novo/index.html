<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova ficha — Paperpel</title><link rel="stylesheet" href="../assets/gamificacao.css?v=20261024-pecas1"></head><body>
<main class="ppg-app" aria-label="Ficha de funcionário"><header class="ppg-windowbar"><div class="ppg-window-title"><span class="ppg-medal">★</span> Ficha</div><div class="ppg-window-actions"><button id="ppg-save" title="Salvar ficha" aria-label="Salvar ficha">▣</button><button id="ppg-minimize" title="Minimizar" aria-label="Minimizar">−</button><button id="ppg-close" title="Fechar" aria-label="Fechar">×</button></div></header>
<div class="ppg-card"><section class="ppg-top"><button class="ppg-photo-frame" id="ppg-photo-button" type="button" title="Escolher foto"><img id="ppg-photo-preview" alt="Foto escolhida" hidden></button><div class="ppg-identity"><div style="display: flex; align-items: center; gap: 8px;"><label for="ppg-class" style="margin: 0;">Classe</label><input id="ppg-class" maxlength="3" placeholder="A / B / S" autocomplete="off" style="border: none; background: transparent; outline: none; width: 70px;"></div><div style="margin-top: 6px;"><input id="ppg-name" maxlength="24" placeholder="Digite o nome" autocomplete="off" style="border: none; background: transparent; outline: none; width: 100%;"></div><!-- Nome usado na futura URL da ficha --></div></section>
<section class="ppg-skills" aria-label="Habilidades"><div class="ppg-skill" data-skill="Atendimento"><span class="ppg-skill-icon">◎</span><span class="ppg-skill-name">Atendimento</span><div class="ppg-stars" role="group" aria-label="Atendimento: até cinco estrelas"></div></div><div class="ppg-skill" data-skill="Informática"><span class="ppg-skill-icon">▣</span><span class="ppg-skill-name">Informática</span><div class="ppg-stars" role="group" aria-label="Informática: até cinco estrelas"></div></div><div class="ppg-skill" data-skill="CorelDraw"><span class="ppg-skill-icon">✎</span><span class="ppg-skill-name">CorelDraw</span><div class="ppg-stars" role="group" aria-label="CorelDraw: até cinco estrelas"></div></div><div class="ppg-skill" data-skill="Impressora"><span class="ppg-skill-icon">▤</span><span class="ppg-skill-name">Impressora</span><div class="ppg-stars" role="group" aria-label="Impressora: até cinco estrelas"></div></div><div class="ppg-skill" data-skill="Disposição"><span class="ppg-skill-icon">✦</span><span class="ppg-skill-name">Disposição</span><div class="ppg-stars" role="group" aria-label="Disposição: até cinco estrelas"></div></div><div class="ppg-skill" data-skill="Design"><span class="ppg-skill-icon">✿</span><span class="ppg-skill-name">Design</span><div class="ppg-stars" role="group" aria-label="Design: até cinco estrelas"></div></div><div class="ppg-skill" data-skill="Atenção"><span class="ppg-skill-icon">◈</span><span class="ppg-skill-name">Atenção</span><div class="ppg-stars" role="group" aria-label="Atenção: até cinco estrelas"></div></div><div class="ppg-skill" data-skill="Carisma"><span class="ppg-skill-icon">☻</span><span class="ppg-skill-name">Carisma</span><div class="ppg-stars" role="group" aria-label="Carisma: até cinco estrelas"></div></div><div class="ppg-skill" data-skill="Trab. Equipe"><span class="ppg-skill-icon">♟</span><span class="ppg-skill-name">Trab. Equipe</span><div class="ppg-stars" role="group" aria-label="Trab. Equipe: até cinco estrelas"></div></div></section><section class="ppg-hobbies"><div class="ppg-hobby-fields"><textarea id="ppg-hobbies" rows="2" maxlength="110" placeholder="Digite até 2 linhas" style="border: none; background: transparent; outline: none; width: 100%; resize: none;"></textarea></div></section><p id="ppg-status" role="status" aria-live="polite"></p></div></main><script src="../assets/gamificacao.js?v=20261024-pecas1"></script></body></html>

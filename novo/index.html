
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova ficha — Paperpel</title>

  <link rel="stylesheet" href="../assets/gamificacao.css?v=20261028-foto1">

  <style>
    @font-face {
      font-family: 'Retro Gaming';
      src: url('../assets/fonts/Retro Gaming.ttf') format('truetype');
    }

    body,
    input,
    textarea,
    button,
    .ppg-app {
      font-family: 'Retro Gaming', monospace, sans-serif !important;
    }

    .ppg-photo-frame {
      display: block;
      width: 100px;
      height: 111px;
      min-width: 100px;
      min-height: 111px;
      box-sizing: border-box;
      padding: 5px;
      border: 0;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      background: url('../assets/pecas-retro/18_quadro_foto.png')
        center / 100% 100% no-repeat;
    }

    #ppg-photo-preview {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #ppg-photo-preview[hidden] {
      display: none !important;
    }

    .ppg-skill {
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      padding: 2px 4px !important;
    }

    .ppg-stars {
      display: flex !important;
      align-items: center !important;
      gap: 3px !important;
      margin-left: 0 !important;
      transform: none !important;
    }

    .ppg-stars img,
    .ppg-stars svg,
    .ppg-stars span {
      width: 20px !important;
      height: 20px !important;
      max-width: 20px !important;
      max-height: 20px !important;
      object-fit: contain !important;
      display: inline-block !important;
    }
  </style>
</head>

<body>
  <main class="ppg-app" aria-label="Ficha de funcionário">

    <header class="ppg-windowbar" style="background-color: #2b5797;">
      <div class="ppg-window-title">
        <span class="ppg-medal">★</span> Ficha
      </div>

      <div class="ppg-window-actions">
        <button id="ppg-save" type="button"
          title="Salvar ficha" aria-label="Salvar ficha">▣</button>

        <button id="ppg-minimize" type="button"
          title="Minimizar" aria-label="Minimizar">−</button>

        <button id="ppg-close" type="button"
          title="Fechar" aria-label="Fechar">×</button>
      </div>
    </header>

    <div class="ppg-card">

      <section class="ppg-top" style="position: relative; left: 2px;">

        <button class="ppg-photo-frame" id="ppg-photo-button"
          type="button" title="Escolher foto"
          aria-label="Escolher foto do funcionário">

          <img id="ppg-photo-preview"
            alt="Foto do funcionário" hidden>
        </button>

        <input id="ppg-photo-file" type="file"
          accept="image/*" hidden>

        <div class="ppg-identity"
          style="position: relative; top: 2px;">

          <div style="display: flex; align-items: center; gap: 6px;">
            <label for="ppg-class"
              style="margin: 0; font-weight: bold; color: #5a3825;">
              CLASSE
            </label>

            <input id="ppg-class" maxlength="3"
              placeholder="S" autocomplete="off"
              style="border: none; background: transparent;
              outline: none; width: 60px; font-size: 1.2rem;
              font-weight: bold; color: #5a3825;
              font-family: 'Retro Gaming', monospace;">
          </div>

          <div style="margin-top: 10px;
            background-image: url('../assets/pecas-retro/19_campo_texto.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            padding: 4px 10px;
            width: 175px;
            height: 32px;
            display: flex;
            align-items: center;">

            <input id="ppg-name" maxlength="24"
              placeholder="Nome do funcionário"
              autocomplete="off"
              style="border: none; background: transparent;
              outline: none; width: 100%; font-size: 0.9rem;
              color: #FDF0B9;
              font-family: 'Retro Gaming', monospace;">
          </div>
        </div>
      </section>

      <section class="ppg-skills" aria-label="Habilidades">

        <div class="ppg-skill" data-skill="Atendimento">
          <span class="ppg-skill-icon">◎</span>
          <span class="ppg-skill-name">ATENDIMENTO</span>
          <div class="ppg-stars" role="group"
            aria-label="ATENDIMENTO: até cinco estrelas"></div>
        </div>

        <div class="ppg-skill" data-skill="Informática">
          <span class="ppg-skill-icon">▣</span>
          <span class="ppg-skill-name">INFORMÁTICA</span>
          <div class="ppg-stars" role="group"
            aria-label="INFORMÁTICA: até cinco estrelas"></div>
        </div>

        <div class="ppg-skill" data-skill="CorelDraw">
          <span class="ppg-skill-icon">✎</span>
          <span class="ppg-skill-name">CORELDRAW</span>
          <div class="ppg-stars" role="group"
            aria-label="CORELDRAW: até cinco estrelas"></div>
        </div>

        <div class="ppg-skill" data-skill="Destreza">
          <span class="ppg-skill-icon">▤</span>
          <span class="ppg-skill-name">DESTREZA</span>
          <div class="ppg-stars" role="group"
            aria-label="DESTREZA: até cinco estrelas"></div>
        </div>

        <div class="ppg-skill" data-skill="Disposição">
          <span class="ppg-skill-icon">✦</span>
          <span class="ppg-skill-name">DISPOSIÇÃO</span>
          <div class="ppg-stars" role="group"
            aria-label="DISPOSIÇÃO: até cinco estrelas"></div>
        </div>

        <div class="ppg-skill" data-skill="Design">
          <span class="ppg-skill-icon">✿</span>
          <span class="ppg-skill-name">DESIGN</span>
          <div class="ppg-stars" role="group"
            aria-label="DESIGN: até cinco estrelas"></div>
        </div>

        <div class="ppg-skill" data-skill="Atenção">
          <span class="ppg-skill-icon">◈</span>
          <span class="ppg-skill-name">ATENÇÃO</span>
          <div class="ppg-stars" role="group"
            aria-label="ATENÇÃO: até cinco estrelas"></div>
        </div>

        <div class="ppg-skill" data-skill="Carisma">
          <span class="ppg-skill-icon">☻</span>
          <span class="ppg-skill-name">CARISMA</span>
          <div class="ppg-stars" role="group"
            aria-label="CARISMA: até cinco estrelas"></div>
        </div>

        <div class="ppg-skill" data-skill="Trab. Equipe">
          <span class="ppg-skill-icon">♟</span>
          <span class="ppg-skill-name">TRAB. EQUIPE</span>
          <div class="ppg-stars" role="group"
            aria-label="TRAB. EQUIPE: até cinco estrelas"></div>
        </div>

      </section>

      <section class="ppg-hobbies">
        <div class="ppg-hobby-fields"
          style="background: none !important; border: none !important;
          box-shadow: none !important;">

          <textarea id="ppg-hobbies" rows="2"
            maxlength="110" placeholder="Cachorro, "
            style="border: none; background: transparent;
            outline: none; width: 88%; resize: none;
            display: block; margin: 18px auto 0;
            color: #FDF0B9; font-size: 0.85rem;
            font-family: 'Retro Gaming', monospace;"></textarea>
        </div>
      </section>

      <p id="ppg-status" role="status" aria-live="polite"></p>

    </div>
  </main>

  <script src="../assets/gamificacao.js?v=20261028-foto1"></script>
</body>
</html>
